name: loc badge

on:
  push:
    branches: [ cxx ]
    paths: [ "include/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc jq

      - name: Count lines in include/
        run: |
          code=$(cloc include --force-lang="C++",hh --json --quiet | jq '.SUM.code')
          message=$(awk -v n="$code" 'BEGIN { if (n >= 1000) printf "%.1fk", n / 1000; else printf "%d", n }')
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"lines of code","message":"%s","color":"informational"}\n' "$message" > .github/badges/loc.json
          echo "include/ has $code lines of code ($message)"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/loc.json
          git diff --cached --quiet || git commit -m "chore: update loc badge"
          git push
